[workspace]
resolver = "2"
members = [
    "contracts/*",
]

[workspace.dependencies]
soroban-sdk = "26.1.1"
stellar-tokens = "0.7.3"
stellar-access = "0.7.3"
stellar-macros = "0.7.3"
stellar-contract-utils = "0.7.3"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
