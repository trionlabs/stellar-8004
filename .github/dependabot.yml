version: 2
updates:
  # Contracts (cargo) are deliberately pinned for reproducible WASM, so they are not listed here.
  - package-ecosystem: npm
    directory: /webapp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types track the Node version we support (engines: >=22.12), not the newest Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
