name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Least-privilege: these jobs only read the repo (build, test, type-check).
permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check tracked Markdown files
        run: python3 .github/scripts/check-markdown-policy.py

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          toolchain: nightly-2025-08-11
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The reproducible-build claim rests on a tracked Cargo.lock; fail fast if
      # it is stale rather than letting the build silently re-resolve deps.
      - name: Verify Cargo.lock is up to date
        run: cargo metadata --locked --format-version=1 > /dev/null

      # Use the same pinned Linux/amd64 image locally and in CI. Native hosts
      # can produce different internal function ordering with the same Rust.
      - name: Build and verify reproducible WASM
        run: make verify-wasm

      - name: Ensure the build did not mutate Cargo.lock
        run: git diff --exit-code Cargo.lock

      - name: Run tests
        run: make test

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

  webapp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # Read the version from the workspace package.json so it cannot
          # drift from the locally-pinned packageManager field.
          package_json_file: webapp/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # High and critical advisories block. Moderate and low ones stay visible in this
      # log and are tracked through Dependabot (.github/dependabot.yml).
      - run: pnpm audit --audit-level=high
      - run: pnpm --filter @trionlabs/stellar8004 build
      - run: pnpm --filter @trionlabs/stellar8004 test
      - run: pnpm --filter @trionlabs/stellar8004 check
      - run: pnpm --filter @stellar8004/d1 test
      - run: pnpm --filter @stellar8004/d1 check
      - run: pnpm --filter @stellar8004/indexer-d1 test
      - run: pnpm --filter @stellar8004/indexer-d1 check
      - run: pnpm --filter @stellar8004/web test
      - run: pnpm --filter @stellar8004/web lint
      - run: pnpm --filter @stellar8004/web check
      - run: pnpm --filter @stellar8004/web build
      # Browser tests: the built worker on a seeded local D1. Each main page, light and dark,
      # must render and pass axe with no serious or critical WCAG 2 A/AA violation.
      # A hung apt mirror or browser download once held this step for 36 minutes;
      # fail fast instead and rerun.
      - run: pnpm --filter @stellar8004/web exec playwright install --with-deps chromium
        timeout-minutes: 10
      - run: pnpm --filter @stellar8004/web e2e
        timeout-minutes: 10
