name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Least-privilege: these jobs only read the repo (build, test, type-check).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32v1-none
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli@25.2.0

      # The reproducible-build claim rests on a tracked Cargo.lock; fail fast if
      # it is stale rather than letting the build silently re-resolve deps.
      - name: Verify Cargo.lock is up to date
        run: cargo metadata --locked --format-version=1 > /dev/null

      - name: Build WASM
        run: make build

      # Enforce the published reproducible-build digests so a toolchain/dep/
      # profile change that alters the bytes is caught here, not in production.
      - name: Verify reproducible WASM hashes
        run: sha256sum -c contracts/wasm.sha256

      - name: Ensure the build did not mutate Cargo.lock
        run: git diff --exit-code Cargo.lock

      - name: Run tests
        run: make test

      - name: Check formatting
        run: cargo fmt --all -- --check

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Read the version from the workspace package.json so it cannot
          # drift from the locally-pinned packageManager field.
          package_json_file: webapp/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trionlabs/stellar8004 build
      - run: pnpm --filter @trionlabs/stellar8004 test
      - run: pnpm --filter @trionlabs/stellar8004 check
      - run: pnpm --filter @stellar8004/indexer test
      - run: pnpm --filter @stellar8004/indexer check
      # Fail if the committed Deno edge copy has drifted from the indexer
      # source. The copy is the deployed artifact, so drift = shipping stale code.
      - run: node scripts/sync-indexer-to-shared.js --check
      # tsc uses Node module resolution and cannot see Deno-only failures (a
      # relative specifier that resolves under Node but 404s under Deno, npm:
      # specifiers, Deno.* APIs). Type-check the real edge entrypoint with Deno
      # — the only faithful pre-deploy gate for the deployed artifact.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/indexer/deno.json supabase/functions/indexer/index.ts
      - run: pnpm --filter @stellar8004/web check
