# stellar8004 explorer — Cloudflare Workers (Static Assets).
#
# WORKERS, NOT PAGES — deliberate. The account runs six Workers and zero Pages projects, and
# Cloudflare steers new projects to Workers Static Assets; Pages would mean adopting the older
# platform. The previous contents of this file were an abandoned Pages attempt
# (`pages_build_output_dir`, name "8004scan") that contradicted the adapter-node setup actually in
# use — it never deployed.
#
# Replaces a self-hosted Docker deployment; the driver was separating this app off a shared box, not
# RAM. The pages and the public API (/api/v1) read the D1 database bound below.
# (Infra topology / origin details deliberately kept out of this public repo.)

name = "stellar8004-web"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-04-01"

# @stellar/stellar-sdk pulls node builtins (stream/crypto/util).
compatibility_flags = ["nodejs_compat"]

# CUTOVER via Workers Route, deliberately NOT a DNS change. The zone is already proxied through
# Cloudflare, so a route intercepts the request at the edge and the DNS record stays untouched;
# rollback is deleting the route, with no DNS propagation to wait on.
#
# Apex only: www.stellar8004.com resolves but returns 404 (never configured), so routing it would
# newly expose a hostname that does not serve today.
#
# ⚠️ MUST stay ABOVE every [table] header. TOML assigns a bare key to the most recent table, so
# placing this under [assets] silently made it `assets.routes` — wrangler warned "Unexpected fields
# found in assets field: routes" and deployed with NO route at all. Top-level keys go first.
routes = [
  { pattern = "stellar8004.com/*", zone_name = "stellar8004.com" }
]

# The account is on Workers PAID, where requests are billable per-million. A workers.dev endpoint is
# the one surface an outsider can drive the bill through, and once the route above serves the apex
# it has no purpose. Same call as apps/ops-cron-worker in the heydodo repo. Verify deploys with
# `wrangler deployments list`, not an HTTP probe against workers.dev.
workers_dev = false

# Per-version preview URLs default ON and would serve this Worker — WITH its secret bindings —
# on a public *.workers.dev hostname, bypassing the route above and defeating workers_dev=false.
# Off, so the route is the only ingress.
preview_urls = false

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true

# No secrets: the data lives in the D1 database bound below, and everything else is public config.

[vars]
# Public, build-and-runtime config read via $env/dynamic/public. Not secrets: contract addresses
# and the RPC URL are on-chain public data, and the client bundle needs them anyway. Mirrors the
# env of the Docker service being replaced.
PUBLIC_STELLAR_NETWORK = "mainnet"
# Browsers call these directly (both send CORS *), in order of preference: on page load the first
# one whose getHealth says "healthy" is used (src/lib/sdk-client.ts). gateway.fm ran a Protocol 30
# release first (2026-11-04); an RPC that cannot follow the chain after the upgrade stops reporting
# healthy, so the list fails over by itself.
PUBLIC_STELLAR_RPC_URL = "https://soroban-rpc.mainnet.stellar.gateway.fm,https://mainnet.sorobanrpc.com"
PUBLIC_IDENTITY_REGISTRY = "CBGPDCJIHQ32G42BE7F2CIT3YW6XRN5ED6GQJHCRZSNAYH6TGMCL6X35"
PUBLIC_REPUTATION_REGISTRY = "CBOIAIMMWAXI57OATLX6BWVDQLCC4YU55HV6MZXFRP6CBSGAMXSTEPPA"
PUBLIC_VALIDATION_REGISTRY = "CBT6WWEVEPT2UFGFGVJJ7ELYGLQAGRYSVGDTGMCJTRWXOH27MWUO7UJG"

# D1 holds the explorer data (agents, feedback, validations, indexer checkpoints) and
# replaces Supabase. Bound by name only: wrangler resolves or provisions the database, so
# no database ID lives in this public repo. Never commit an ID wrangler writes back here.
[[d1_databases]]
binding = "DB"
database_name = "stellar8004"
migrations_dir = "../../packages/d1/migrations"

# Public API (/api/v1): 30 requests a minute per client IP. Cloudflare counts per location
# and eventually consistently, so the limit is approximate by design.
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "8004"

  [ratelimits.simple]
  limit = 30
  period = 60
